<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Depth Anything V2 - 3D Terrain Flythrough</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #050505; font-family: sans-serif; }
        #ui { position: absolute; top: 15px; left: 15px; z-index: 10; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 8px; color: #fff; }
        input, button { margin-top: 10px; width: 100%; padding: 8px; }
    </style>
</head>
<body>

    <div id="ui">
        <h3>DepthWizard 3D Mesh</h3>
        <input type="file" id="imageInput" accept="image/*">
        <button onclick="uploadImage()">Generate 3D Graph</button>
    </div>

    <script>
        let scene, camera, renderer, controls, mesh;

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, -100, 80);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            const light = new THREE.DirectionalLight(0xffffff, 1.2);
            light.position.set(50, 50, 100);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0xffffff, 0.5));

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        async function uploadImage() {
            const input = document.getElementById('imageInput');
            if (!input.files[0]) return alert("Select an image!");

            const formData = new FormData();
            formData.append('file', input.files[0]);

            const res = await fetch('http://localhost:8000/generate-3d', { method: 'POST', body: formData });
            const data = await res.json();

            createTerrain(data.depth_data, data.grid_size, data.rgb_hex);
        }

        function createTerrain(depthMatrix, size, hexRGB) {
            if (mesh) scene.remove(mesh);

            // Create flat 2D plane geometry with grid subdivisions
            const geometry = new THREE.PlaneGeometry(120, 120, size - 1, size - 1);
            const posAttr = geometry.attributes.position;

            // Displace Z-coordinates using Depth Anything V2 depth values
            let idx = 0;
            for (let i = 0; i < size; i++) {
                for (let j = 0; j < size; j++) {
                    const depthVal = depthMatrix[i][j];
                    posAttr.setZ(idx, depthVal * 30); // 30 is the height scale multiplier
                    idx++;
                }
            }
            geometry.computeVertexNormals();

            // Texture the plane with the original RGB image
            const img = new Image();
            img.src = "data:image/jpeg;base64," + hexToBase64(hexRGB);
            img.onload = () => {
                const texture = new THREE.CanvasTexture(img);
                const material = new THREE.MeshStandardMaterial({ map: texture, side: THREE.DoubleSide, roughness: 0.6 });
                mesh = new THREE.Mesh(geometry, material);
                scene.add(mesh);
            };
        }

        function hexToBase64(hex) {
            return btoa(hex.match(/\w{2}/g).map(a => String.fromCharCode(parseInt(a, 16))).join(""));
        }

        init();
    </script>
</body>
</html>
